name: 🐛 Bug Report
description: Reporta un error para ayudarnos a mejorar
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Gracias por tomarte el tiempo para reportar un error. Por favor, completa la siguiente información.
  - type: textarea
    id: description
    attributes:
      label: Descripción del Error
      description: Una descripción clara y concisa de lo que es el error.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Pasos para Reproducir
      description: |
        1. Ir a '...'
        2. Hacer clic en '....'
        3. Desplazarse hacia abajo hasta '....'
        4. Ver el error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportamiento Esperado
      description: Una descripción clara de lo que esperabas que sucediera.
